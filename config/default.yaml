# Base pipeline configuration.
#
# Every profile in config/profiles/ is this file with a small overlay applied.
# Keys are validated with extra="forbid", so a typo here is a startup error
# rather than a silently ignored setting that invalidates a benchmark run.

description: "Base configuration. Profiles overlay this file."

# --- Models -----------------------------------------------------------------
# Swapped in exactly one place: src/vidyarag/llm/provider.py
#
# Models are PINNED, never aliased. `gemini-flash-latest` would silently change
# model underneath a benchmark and make every reported delta incomparable -- the
# one thing this project cannot afford. Note that gemini-2.5-* returns 404 for
# accounts created after ~mid-2026 ("no longer available to new users"), so the
# 3.x line is not a preference, it is what exists.
generation_model: gemini-3.5-flash
grader_model: gemini-3.5-flash-lite
temperature: 0.0

# Embeddings run locally via fastembed (ONNX, CPU, no torch, no API key).
#
# This is not only a cost decision. The deployed Space already ships a
# self-contained Qdrant index so a dead cloud cluster cannot break the demo
# months later; embedding locally closes the last hole in that story, leaving
# retrieval with no external dependency at all.
#
# 512 is the model's hard sequence limit -- text beyond it is silently dropped
# at embed time, so chunking measures against this tokeniser, not tiktoken.
embedding_model: BAAI/bge-base-en-v1.5
embedding_dim: 768
embedding_max_tokens: 512

# --- Chunking ---------------------------------------------------------------
# 512 tokens is roughly 1.5 paragraphs of textbook prose: large enough to hold
# a self-contained concept, small enough that a 5-chunk context stays near
# 2.6k tokens and leaves ample room for generation.
#
# Trade-off: 256 raises precision but fragments multi-sentence definitions;
# 1024 improves recall on long explanations but dilutes the embedding and
# raises per-query cost. Re-measure before changing.
chunking:
  chunk_size: 512
  chunk_overlap: 64
  respect_sentence_boundaries: true

# --- Retrieval --------------------------------------------------------------
# top_k_retrieve > top_k_context by design: a reranker can only add value when
# given a candidate pool wider than the final selection. 20 -> 5 is a 4x pool,
# which is the latency/quality sweet spot on 2 vCPU.
retrieval:
  top_k_retrieve: 20
  top_k_context: 5
  use_hybrid: false
  use_reranker: false
  use_decomposition: false
  # ONNX cross-encoder via fastembed: 80MB and no torch dependency, which
  # keeps the deployed image near 400MB instead of ~2.5GB.
  # BAAI/bge-reranker-base (1.04GB, MIT) is ablated against this in Phase 4.
  reranker_model: Xenova/ms-marco-MiniLM-L-6-v2
  sparse_model: Qdrant/bm25

# --- Corrective self-check --------------------------------------------------
# Thresholds are Phase 5 starting points, tuned against the gold set and
# reported in docs/EVALUATION.md. They are not asserted constants.
corrective:
  enabled: false
  accept_threshold: 0.8
  abstain_threshold: 0.5
  max_attempts: 2

# --- Guardrails -------------------------------------------------------------
guardrails:
  check_user_input: false
  check_retrieved_context: false
