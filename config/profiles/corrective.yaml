# Phase 5: reranking + the corrective self-check loop.
#
# Built on `rerank` rather than `baseline`, because rerank is what Phase 4
# concluded should ship. The delta to read here is corrective-vs-rerank; the
# comparison against baseline additionally carries reranking's contribution.
#
# This comment used to say the profile existed to move "abstention recall
# 0.000 in baseline, rerank and decompose alike", because "no profile before
# this one can decline to answer". That was a truncated judge, not a
# measurement: re-judged, all three already refuse 12/12 unanswerable questions
# in prose. Abstention recall is 1.000 with and without this loop. What it
# changes is the form of a refusal -- an explicit flag with no citations -- and
# it adds a claim-level score and one targeted retry. See docs/EVALUATION.md.
#
# Thresholds are untuned defaults, not the output of a sweep -- see
# docs/DESIGN.md, "Abstention: thresholds, and why they were not swept". Recall
# is at ceiling for every profile, so tuning could only move precision, and the
# imprecise refusals were retrieval failures that no threshold can fix.

name: corrective
description: "Reranking + claim-level groundedness check with bounded retry and abstention."

retrieval:
  use_hybrid: false
  use_reranker: true
  use_decomposition: false

corrective:
  enabled: true
  accept_threshold: 0.8
  abstain_threshold: 0.5
  max_attempts: 2

guardrails:
  check_user_input: false
  check_retrieved_context: false
