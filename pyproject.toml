[project]
name = "vidyarag"
version = "0.1.0"
description = "Agentic, self-correcting RAG study assistant over open-license OpenStax textbooks."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Neha Bharti" }]
requires-python = ">=3.11,<3.13"

# Runtime dependencies only. Everything needed to serve a query.
# Evaluation tooling (ragas -> langchain) is deliberately NOT here: it would
# add ~200MB to the deployed image for code that never runs in production.
dependencies = [
    # Orchestration
    "llama-index-core>=0.12,<0.15",
    "llama-index-vector-stores-qdrant>=0.4,<0.8",
    # Vector store. [fastembed] provides ONNX dense embeddings, sparse (BM25),
    # and cross-encoder reranking -- all on CPU, without dragging in torch.
    "qdrant-client[fastembed]>=1.12,<2.0",
    # Generation and grading. Embeddings are local, so this is the only
    # external model dependency, and ingestion does not need it at all.
    "google-genai>=1.0,<2.0",
    # Ingestion. httpx is already present transitively via openai, but corpus
    # download depends on it directly -- an undeclared import that survives only
    # because another package happens to pull it in is a break waiting to happen.
    "pymupdf>=1.24,<2.0",
    "httpx>=0.27,<1.0",
    # Service
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "gradio>=5.0,<6.0",
    # Config / plumbing
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "tenacity>=9.0,<10.0",
    "structlog>=24.4,<26.0",
    "typer>=0.15,<1.0",
    "rich>=13.9,<15.0",
]

[project.urls]
Homepage = "https://github.com/NehaBharti08/VidyaRAG"
Repository = "https://github.com/NehaBharti08/VidyaRAG"

[project.scripts]
vidyarag = "vidyarag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.8,<1.0",
    "black>=24.10,<26.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
    "types-pyyaml>=6.0,<7.0",
    "respx>=0.22,<1.0",
]

# RAGAS moved metrics to `ragas.metrics.collections` in v0.4; the legacy
# `ragas.metrics` path is deprecated and removed in 1.0. All contact with this
# API is confined to eval/metrics.py so version churn touches one file.
eval = [
    "ragas>=0.4,<0.5",
    # UPSTREAM BUG PIN. ragas 0.4.x imports
    # `langchain_community.chat_models.vertexai`, which langchain-community
    # removed in 0.4.0, so `import ragas` fails outright (ragas #2741, #2745).
    # Downgrading ragas does not help -- 0.3.9 fails identically, because the
    # break is on the langchain side. Pinning langchain-community to the 0.3.x
    # line keeps the modern `ragas.metrics.collections` API working.
    #
    # Contained to this group, so the runtime image never sees langchain at all.
    # Revisit when ragas ships a release that drops the dead import.
    "langchain-community<0.4",
    # SECOND UPSTREAM WORKAROUND. ragas decides whether an LLM client is async
    # by looking for `chat.completions.create` -- an OpenAI shape. A
    # `google.genai.Client` has no such attribute, so ragas concludes
    # "synchronous", while the collections metrics only have an async path.
    # Gemini therefore cannot drive them as shipped.
    #
    # The fix is Google's own OpenAI-compatibility endpoint: an AsyncOpenAI
    # client pointed at generativelanguage.googleapis.com satisfies the
    # detection and still calls Gemini. So `openai` is a client library here,
    # not a model provider -- no OpenAI account or spend is involved.
    "openai>=1.60,<3.0",
    "pandas>=2.2,<3.0",
    "datasets>=3.0,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vidyarag"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "eval", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # unused arguments
    "SIM",  # flake8-simplify
    "TID",  # tidy imports
    "PTH",  # prefer pathlib
    "BLE",  # blind except - allowed only where explicitly justified with noqa
    "RUF",
]
ignore = [
    "E501",  # line length is black's job
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
# Test doubles legitimately accept arguments they ignore -- a stub standing in
# for a real signature has to match it without using it.
"tests/**" = ["ARG001", "ARG002", "ARG005"]

[tool.black]
line-length = 100
target-version = ["py311"]

# mypy runs strict on the core package only. Tests, eval harness and scripts
# are exploratory by nature; forcing strict typing there buys noise, not safety.
[tool.mypy]
python_version = "3.11"
files = ["src/vidyarag"]
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "fastembed.*",
    "qdrant_client.*",
    "llama_index.*",
    "fitz",
    "gradio.*",
    # `eval` dependency group -- not installed in the default dev sync, and
    # imported lazily so the runtime package works without them.
    "ragas.*",
    "openai.*",
    "pandas.*",
]
ignore_missing_imports = true

# The RAGAS embedding adapter subclasses a base class that resolves to `Any`
# whenever the `eval` group is absent -- which is exactly the case inside the
# pre-commit mypy hook's isolated environment. Without this, the hook reports an
# error the project-level mypy cannot reproduce. Scoped to the one module that
# legitimately needs it rather than relaxed globally.
[[tool.mypy.overrides]]
module = "vidyarag.evaluation.metrics"
disallow_subclassing_any = false

# PyMuPDF ships partial annotations: the module imports cleanly under strict
# mode, but its constructors are untyped, so every `pymupdf.open(...)` trips
# disallow_untyped_calls. Narrowed to that one rule rather than silencing the
# module, so genuine type errors in our own PyMuPDF usage still surface.
[[tool.mypy.overrides]]
module = ["vidyarag.ingest.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: touches a live external service (deselect with '-m \"not integration\"')",
    "costly: makes real paid API calls (deselect with '-m \"not costly\"')",
]

[tool.coverage.run]
source = ["src/vidyarag"]
branch = true
