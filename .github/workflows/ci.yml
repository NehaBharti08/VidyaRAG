name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests must never reach a paid API or a live vector store. The suite runs
  # against in-process Qdrant, and anything that would spend money is marked
  # `costly` and deselected below.
  OPENAI_API_KEY: test-key-not-real
  QDRANT_MODE: embedded
  QDRANT_PATH: ":memory:"

jobs:
  check:
    name: lint · types · tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # 3.10 is not optional coverage. The demo runs on a Hugging Face
        # ZeroGPU Space, whose image is pinned to 3.10 by the platform, so a
        # 3.11-only construct that only CI on 3.11 sees is a construct that
        # reaches production and breaks the deployed app on import.
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # --python is load-bearing: without it uv resolves against whatever
        # interpreter it prefers, and the 3.10 leg of the matrix would quietly
        # run on 3.11 and prove nothing.
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests
        run: uv run pytest -m "not costly" --cov --cov-report=term-missing

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the diff
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
