name: Docker

on:
  push:
    branches: [main]
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "uv.lock", "src/**", "config/**", "docker-compose.yml", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "uv.lock", "src/**", "config/**", "docker-compose.yml", ".github/workflows/docker.yml"]
  workflow_dispatch:

# Docker Desktop is not installed on the development machine, so CI is where the
# image is actually proven to build. A Dockerfile nobody has built is a claim,
# not a deliverable.
jobs:
  build:
    name: build image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vidyarag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size
        run: |
          size=$(docker image inspect vidyarag:ci --format='{{.Size}}')
          mb=$((size / 1024 / 1024))
          echo "image size: ${mb} MB" >> "$GITHUB_STEP_SUMMARY"
          # The no-torch decision is worth defending automatically. A stack that
          # quietly reintroduces torch would roughly sextuple this.
          if [ "$mb" -gt 900 ]; then
            echo "::error::image is ${mb} MB, over the 900 MB budget - has torch crept in?"
            exit 1
          fi

      - name: Package imports inside the image
        run: |
          docker run --rm vidyarag:ci python -c "import vidyarag; print(vidyarag.__version__)"

      - name: CLI responds
        run: docker run --rm vidyarag:ci python -m vidyarag.cli version
      # Building and importing is not serving. Both the HEALTHCHECK and the
      # documented volume mount were wrong for the whole life of this file, and
      # neither step above could see it because neither ever started the server.
      # This runs the image the way the Dockerfile tells people to.
      - name: Container serves requests and reports healthy
        run: |
          docker volume create vidyarag-index
          docker run -d --name api -p 8000:8000 -v vidyarag-index:/app/data/index vidyarag:ci
          for i in $(seq 1 45); do
            running=$(docker inspect --format='{{.State.Running}}' api)
            state=$(docker inspect --format='{{.State.Health.Status}}' api)
            echo "running=$running health=$state"
            [ "$running" = "true" ] || break
            [ "$state" = "healthy" ] && break
            sleep 4
          done
          echo "--- container log ---"
          docker logs api 2>&1 | tail -40
          test "$(docker inspect --format='{{.State.Health.Status}}' api)" = "healthy"
          curl -fsS http://127.0.0.1:8000/v1/config | tee /dev/stderr | grep -q '"profile":"guarded"'
          curl -fsS http://127.0.0.1:8000/v1/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Reported versions agree
        run: |
          cli=$(docker run --rm vidyarag:ci python -m vidyarag.cli version | awk '{print $2}')
          api=$(curl -fsS http://127.0.0.1:8000/openapi.json | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
          echo "cli=$cli api=$api"
          test -n "$cli" && test "$cli" = "$api"

      # The server-backed mode the README advertises had never run against a
      # real Qdrant server: docker-compose.yml was untested and its healthcheck
      # comment described a different command from the one it ran. Bring it up,
      # wait for its own healthcheck, then point the built image at it.
      - name: Server mode works against docker compose Qdrant
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            s=$(docker inspect --format='{{.State.Health.Status}}' vidyarag-qdrant)
            echo "qdrant health=$s"
            [ "$s" = "healthy" ] && break
            sleep 3
          done
          test "$(docker inspect --format='{{.State.Health.Status}}' vidyarag-qdrant)" = "healthy"
          docker run --rm --network host -e QDRANT_MODE=server -e QDRANT_URL=http://127.0.0.1:6333 vidyarag:ci python -m vidyarag.cli health
