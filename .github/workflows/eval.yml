name: Evaluation

# Never on push. A full run is ~58 questions through generation and grading
# against a rate-limited free tier, so wiring it to every commit would exhaust
# the daily quota and block the work it exists to measure.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile to evaluate"
        required: true
        default: "guarded"
        type: choice
        options: [baseline, rerank, decompose, corrective, guarded]
      rate:
        description: "Graded metrics per minute (lower if you see 429s)"
        required: false
        default: "5"

jobs:
  evaluate:
    name: run gold set
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Before anything expensive. Building the index takes roughly an hour and
      # needs no key, so a missing secret would otherwise surface at the very
      # last step, an hour in, as a generic failure. Check it in five seconds
      # and say what to do about it.
      - name: Require the API key up front
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "::error::GOOGLE_API_KEY is not set for this repository."
            echo "This workflow generates and grades 58 answers, so it needs a key."
            echo "Add one at Settings -> Secrets and variables -> Actions."
            echo "Free key, no card: https://aistudio.google.com/apikey"
            exit 1
          fi
          echo "GOOGLE_API_KEY is present."

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv python install 3.11
      - run: uv sync --frozen --group eval

      # The index is derived data and is not committed. Rebuilding it here is
      # offline and needs no key -- embeddings run locally -- but it does take
      # roughly an hour, which is why this workflow is manual.
      - name: Build the index
        run: |
          uv run vidyarag download
          uv run vidyarag ingest

      - name: Evaluate
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          QDRANT_MODE: embedded
          QDRANT_PATH: data/index
        run: uv run vidyarag eval --profile "${{ inputs.profile }}" --rate "${{ inputs.rate }}"

      # Uploaded rather than committed. A run from CI has not been reviewed, and
      # eval/results/ is the evidence directory -- a number lands there only
      # once a person has looked at it.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ inputs.profile }}
          path: eval/results/
          retention-days: 30
