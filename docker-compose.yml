# Local Qdrant for development.
#
# Not required to run VidyaRAG: src/vidyarag/store/client.py resolves three
# modes behind one QdrantClient API, and the default `embedded` mode needs no
# server at all. Use this when you want to exercise the same server-backed
# path that Qdrant Cloud uses.
#
#   docker compose up -d
#   QDRANT_MODE=server QDRANT_URL=http://localhost:6333 uv run vidyarag health

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: vidyarag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST + dashboard at http://localhost:6333/dashboard
      - "6334:6334" # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_TLS: "false"
      QDRANT__LOG_LEVEL: "INFO"
    healthcheck:
      # Qdrant images are distroless-ish; use the bundled entrypoint binary
      # rather than assuming curl exists.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
